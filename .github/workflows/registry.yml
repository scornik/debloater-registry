name: Registry

# What can go wrong with data: it stops parsing, the manifest stops describing
# what is here, or a document loses a field the plugin reads. All three are
# caught below, with nothing installed beyond Node — a check that needs no
# dependencies is one that still runs in two years.
#
# Schema validation is deliberately not duplicated here. The plugin validates
# every document as it loads it, and its suite runs against this content; a
# second validator in this repository would eventually disagree with the one
# whose opinion actually decides whether a site loads the registry.
#
# ## Content on main, signatures on tags
#
# The signature check used to run on every push. It moved to tags in Phase 21;
# docs/DECISIONS.md D-0067 is the reasoning. In short: the pipeline opens pull
# requests and has no private key, so requiring a valid signature on every push
# made every automated proposal impossible — not caught, impossible.
#
# Integrity did not move. The bot regenerates the manifest alongside its
# changes, so a proposal whose hashes do not match is red exactly as a person's
# would be.
#
# Sites fetch `<base>/<tag>/<path>`, never `main`, so nothing a site consumes
# got weaker. What did change is that `release-gate` below is now the only thing
# standing between a bad manifest and a release, so it is not skippable and
# tests/release-gate.test.mjs asserts that about this file.
#
# ## `tags:` is not decoration
#
# This filter did not exist until Phase 21, and its absence meant a tag push
# never started this workflow at all. The "tag matches the manifest" step below
# carried an `if: startsWith( github.ref, 'refs/tags/' )` that could not become
# true, so it had never run once. A condition that is never evaluated looks
# exactly like a condition that always passes.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Every document parses, and the manifest describes what is here
        run: node tests/integrity.mjs

      # The pipeline's own judgement code: the fact diff, the safer/bolder
      # classifier, the evidence gate and the manifest builder. They decide what
      # may merge without a person, so they are held to the same bar as the data
      # they change.
      - name: The pipeline's decisions are tested
        run: node --test tests/pipeline.test.mjs tests/manifest.test.mjs tests/release-gate.test.mjs

  # The release gate.
  #
  # The only thing between a manifest and a release, on exactly one trigger: a
  # pushed tag. Three properties are deliberate, and tests/release-gate.test.mjs
  # asserts each of them against this file, because a gate nobody checks is a
  # gate that quietly stops being one.
  #
  #   1. No `continue-on-error`. A failure here fails the workflow.
  #   2. No `if:` on any checking step. The job's own `if` selects tags; a
  #      second condition inside it would be a way for a check to evaluate
  #      itself away on the one ref it exists for.
  #   3. A missing manifest.sig is a failure, not an absence.
  #
  # Fail-probed rather than assumed: a tag whose manifest.sig is stale goes red.
  release-gate:
    name: Signed release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    if: startsWith( github.ref, 'refs/tags/' )

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Both halves, before anything reads either. A release is a manifest and a
      # detached signature over it; one without the other is neither, and "the
      # file was not there" must never read as "nothing was wrong".
      - name: A release has both halves
        run: |
          for required in manifest.json manifest.sig state/released.json; do
            if [ ! -f "$required" ]; then
              echo "::error::$required is missing. A tag is a manifest, a signature over it, and a record of both."
              exit 1
            fi
          done

      - name: The manifest still describes what is here
        run: node tests/integrity.mjs

      - name: The signature is this manifest's, made with the pinned key
        run: node tests/signature.mjs

      # A release is identified by its tag, and the manifest carries the tag it
      # was generated for. If a tag is pushed that the manifest does not name, a
      # site would report a version it is not running.
      - name: The tag matches the manifest
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          recorded=$(node -p "require('./manifest.json').tag")

          if [ "$tag" != "$recorded" ]; then
            echo "::error::Tag $tag was pushed, but manifest.json says $recorded."
            exit 1
          fi

          echo "Tag and manifest agree on $tag."

      # What `main` advertises about itself has to become true at the moment it
      # becomes true. A tag releasing something state/released.json does not name
      # leaves the repository describing the previous release to everyone
      # reading it.
      - name: state/released.json names this release
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          released=$(node -p "require('./state/released.json').tag")

          if [ "$tag" != "$released" ]; then
            echo "::error::state/released.json says $released, but this tag is $tag."
            echo "::error::Use 'make registry-release TAG=$tag' rather than tagging by hand."
            exit 1
          fi

          echo "state/released.json agrees this is $tag."
